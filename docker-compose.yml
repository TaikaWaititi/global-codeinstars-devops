services:
  db:
    image: postgres:16-alpine
    container_name: postgres-helios-rm566515
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helios_db}
      POSTGRES_USER: ${POSTGRES_USER:-helios_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helios_pass}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data_rm566515:/var/lib/postgresql/data
    networks:
      - helios-net-rm566515
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helios_user} -d ${POSTGRES_DB:-helios_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sistema-helios-app-rm566515:1.0.0
    container_name: sistema-helios-app-rm566515
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-helios_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-helios_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-helios_pass}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_H2_CONSOLE_ENABLED: "false"
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    networks:
      - helios-net-rm566515

volumes:
  postgres_data_rm566515:
    name: postgres_data_rm566515

networks:
  helios-net-rm566515:
    name: helios-net-rm566515
    driver: bridge
